<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script src="./node_modules/jquery/dist/jquery.min.js"></script>
</head>

<body style="background: pink;">
    <h1>Animate Method</h1>
    <div id="box" style="width: 100px; height: 100px; background-image: url(/images/cloud.jpg);"></div><br><br>
    <button id="animatebutton">Animate Button</button>

    <h1>Chain Multiple Jquery Method</h1>
    <h3 id="text">Watch this paragraph animate and change!</h3>
    <button id="btn">chain effect</button><br><br>
    <button id="btn1">chain with toggle</button>
    <script>
        $("#animatebutton").click(() => {
            $("#box").animate({
                width: "100%",
                height: "100vh",
                opacity: 0.7
            }, 800);
        });

        $("#btn").click(function() {
            $("#text").slideUp(500).slideDown(500).css("color", "red");

        });

        $("#btn1").click(function() {
            $("#text").slideToggle(500).css("color", "red");

        });
    </script>
</body>

</html>
