<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
</head>

<body>
    <div class="container shadow p-3 mb-5 bg-body-tertiary rounded">
        <h1 class="text-center fs-3">Accordion</h1>
        <div class="accordion" id="accordionExample">
            <div class="accordion-item">
                <h2 class="accordion-header">
                    <button class="accordion-button" type="button" data-bs-toggle="collapse"
                        data-bs-target="#collapseOne" aria-expanded="true" aria-controls="collapseOne">
                        Accordion Item #1
                    </button>
                </h2>
                <div id="collapseOne" class="accordion-collapse collapse show" data-bs-parent="#accordionExample">
                    <img src="/images/cloud.jpg" style="width: 550px; height: 300px;">
                    <img src="/images/itachi.jpg" style="width: 550px; height: 300px;">
                </div>
            </div>
            <div class="accordion-item">
                <h2 class="accordion-header">
                    <button class="accordion-button collapsed" type="button" data-bs-toggle="collapse"
                        data-bs-target="#collapseTwo" aria-expanded="false" aria-controls="collapseTwo">
                        Accordion Item #2
                    </button>
                </h2>
                <div id="collapseTwo" class="accordion-collapse collapse" data-bs-parent="#accordionExample">
                    <div class="accordion-body">
                        <img src="/images/cloud2.jpg" style="width: 500px; height: 300px;">
                        <img src="/images/osean.jpg" style="width: 500px; height: 300px;">
                    </div>
                </div>
            </div>
            <div class="accordion-item">
                <h2 class="accordion-header">
                    <button class="accordion-button collapsed" type="button" data-bs-toggle="collapse"
                        data-bs-target="#collapseThree" aria-expanded="false" aria-controls="collapseThree">
                        Accordion Item #3
                    </button>
                </h2>
                <div id="collapseThree" class="accordion-collapse collapse" data-bs-parent="#accordionExample">
                    <div class="accordion-body">
                        <img src="/images/cloud1.jpg" style="width: 500px; height: 300px;">
                        <img src="/images/itchi.jpg" style="width: 500px; height: 300px;">
                    </div>
                </div>
            </div>
        </div>
        <form>
            <div class="container shadow p-3 mb-5 bg-body-tertiary rounded">
                <h1 class="text-center fs-3">Form</h1>
                <div class="row ">
                    <div class="col">
                        <label class="form-label">First Name:</label>
                        <input type="text" class="form-control " name="fname">
                    </div>
                    <div class="col">
                        <label class=" form-label">Last Name:</label>
                        <input type="text" class="form-control" name="lname">
                    </div>
                </div>

                <div class=" mt-3">
                    <label class="form-label">Email:</label>
                    <input type="Email" class="form-control" name="email">
                </div>
                <div class="mt-3">
                    <label class="form-label">Password:</label>
                    <input type="password" class="form-control" name="password">
                </div>
                <div class="mt-3 form-check">
                    <input type="checkbox" class="form-check-input" id="exampleCheck1">
                    <label class="form-check-label" for="exampleCheck1">Check me out</label>
                </div>
                <div class="d-grid gap-2 col-6 mx-auto">
                    <button class="btn btn-outline-primary" type="button">Submit</button>
                </div>
            </div>
        </form>

    </div>
    <script>
        var a = 10;
        var b = 10;

        // document.writeln(a - b);
        document.write(a + b);
        // console.log(a - b);
    </script>
</body>

</html>
