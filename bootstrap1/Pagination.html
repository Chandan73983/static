<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
     <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
</head>

<body>
    <div class="container shadow p-3 mb-5 bg-body-tertiary rounded">
        <h1 class="text-center fs-3">Accordion</h1>
        <div class="accordion" id="accordionExample">
            <div class="accordion-item">
                <h2 class="accordion-header">
                    <button class="accordion-button" type="button" data-bs-toggle="collapse"
                        data-bs-target="#collapseOne" aria-expanded="true" aria-controls="collapseOne">
                        Accordion Item #1
                    </button>
                </h2>
                <div id="collapseOne" class="accordion-collapse collapse show" data-bs-parent="#accordionExample">
                    <img src="/images/cloud.jpg" style="width: 550px; height: 300px;">
                    <img src="/images/itachi.jpg" style="width: 550px; height: 300px;">
                </div>
            </div>
            <div class="accordion-item">
                <h2 class="accordion-header">
                    <button class="accordion-button collapsed" type="button" data-bs-toggle="collapse"
                        data-bs-target="#collapseTwo" aria-expanded="false" aria-controls="collapseTwo">
                        Accordion Item #2
                    </button>
                </h2>
                <div id="collapseTwo" class="accordion-collapse collapse" data-bs-parent="#accordionExample">
                    <div class="accordion-body">
                        <img src="/images/cloud2.jpg" style="width: 500px; height: 300px;">
                        <img src="/images/osean.jpg" style="width: 500px; height: 300px;">
                    </div>
                </div>
            </div>
            <div class="accordion-item">
                <h2 class="accordion-header">
                    <button class="accordion-button collapsed" type="button" data-bs-toggle="collapse"
                        data-bs-target="#collapseThree" aria-expanded="false" aria-controls="collapseThree">
                        Accordion Item #3
                    </button>
                </h2>
                <div id="collapseThree" class="accordion-collapse collapse" data-bs-parent="#accordionExample">
                    <div class="accordion-body">
                        <img src="/images/cloud1.jpg" style="width: 500px; height: 300px;">
                        <img src="/images/itchi.jpg" style="width: 500px; height: 300px;">
                    </div>
                </div>
            </div>
        </div>
        <nav aria-label="Page navigation example">
            <ul class="pagination justify-content-center mt-3">
                <li class="page-item disabled">
                    <a class="page-link">Previous</a>
                </li>
                <li class="page-item"><a class="page-link"
                        href="https://getbootstrap.com/docs/5.3/components/pagination/">1</a></li>
                <li class="page-item"><a class="page-link" href="https://nicewebtechnologies.com/">2</a></li>
                <li class="page-item"><a class="page-link" href="https://www.youtube.com/">3</a></li>
                <li class="page-item"><a class="page-link" href="https://www.w3schools.com/">4</a></li>
                <li class="page-item"><a class="page-link" href="https://tailwindcss.com/">5</a></li>
                <li class="page-item"><a class="page-link" href="#">Next</a></li>

            </ul>
        </nav>
    </div>

</body>

</html>
