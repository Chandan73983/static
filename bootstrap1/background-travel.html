<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Wanderly - Adventure Awaits</title>

    <!-- Google Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Pacifico&display=swap" rel="stylesheet">

    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-ox;
        }
        
        body {
            font-family: "Inter", sans-serif;
            background: #fff;
            color: #10243e;
        }
        /* =========================
       HERO
    ========================= */
        
        .hero {
            position: relative;
            width: 100%;
            min-height: 520px;
            overflow: hidden;
            background: #dff3ff;
        }
        /* Main background image */
        
        .hero-image {
            position: absolute;
            inset: 0;
            background-image: url("https://images.unsplash.com/photo-1530789253388-582c481c54b0?auto=format&fit=crop&w=2000&q=90");
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            transform: scale(1.02);
        }
        /* =========================
       BLUR EFFECT
    ========================= */
        
        .blur-layer {
            position: absolute;
            left: -50px;
            top: -50px;
            width: 65%;
            height: calc(100% + 100px);
            background: rgba(255, 255, 255, 0.45);
            filter: blur(25px);
            z-index: 1;
        }
        /* =========================
       WHITE GRADIENT
    ========================= */
        
        .hero::after {
            content: "";
            position: absolute;
            inset: 0;
            background: linear-gradient(90deg, rgba(255, 255, 255, 0.98) 0%, rgba(255, 255, 255, 0.94) 15%, rgba(255, 255, 255, 0.78) 28%, rgba(255, 255, 255, 0.40) 45%, rgba(255, 255, 255, 0.05) 65%, rgba(255, 255, 255, 0) 80%);
            z-index: 2;
            pointer-events: none;
        }
        
        .cloud-glow {
            position: absolute;
            z-index: 3;
            width: 500px;
            height: 250px;
            left: 10%;
            top: 30%;
            background: rgba(255, 255, 255, 0.2);
            filter: blur(60px);
            border-radius: 50%;
            pointer-events: none;
        }
    </style>
</head>

<body>

    <!-- =========================
       HERO SECTION
  ========================= -->

    <section class="hero">

        <!-- Background -->
        <div class="hero-image"></div>

        <!-- Blur -->
        <div class="blur-layer"></div>

        <!-- Soft glow -->
        <div class="cloud-glow"></div>


    </section>

</body>

</html>
