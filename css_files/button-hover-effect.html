<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
         .button{width: 200px;
        padding: 20px 25px;
    text-decoration: none;
border-radius: 10px;
font-size: xx-large;
cursor: pointer;
background-color: rgb(254, 6, 6);}

span{display: inline-block;
position: relative; 
transition: 0.5s;}

.button span:after {
  content: '\00bb';
  position: absolute;
  opacity: 0;
  right: -20px;
  transition: 0.5s;
}
.button:hover span{padding-right: 25px;}
.button:hover span:after{opacity: 1;
right: 0;}

    </style>
</head>
<body>
    <h2>Animated Button</h2>

<button class="button" style="vertical-align:middle"><span><b>Hover</b> </span></button>
</body>
</html>
