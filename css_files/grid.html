<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <style>
    .container {
      background-color: lightgray;
      margin: 10px;
      padding: 20px;
      display: grid;
      grid-template-columns: 80px 200px auto;
      gap: 10px;
      justify-content: space-between;
    }


    .container div {
      background-color: dodgerblue;
      color: #000;
      padding: 10px;
      font-size: 30px;
      text-align: center;
    }
  </style>
</head>

<body>

  <h1>Grid Container</h1>

  <p>A grid container contains one or more grid items arranged in columns and rows.</p>
  <p>All direct child elements of a grid container automatically become grid items.</p>

  <div class="container">
    <div>1</div>
    <div>2</div>
    <div>3</div>
    <div>4</div>
    <div>5</div>
    <div>6</div>
    <div>7</div>
    <div>8</div>
    <div>9</div>
    <div>10</div>
  </div>
</body>

</html>
