<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>SEO Card</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f5f6f8;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .card {
            background: #ffffff;
            width: 300px;
            /* padding: 30px 25px; */
            border-radius: 8px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.05);
            border-top-left-radius: 25%;
        }

        .icon-box {
            /* border-top-left-radius: 25%; */

            width: 70px;
            height: 70px;           
            background: #e11d2e;
            border-radius: 25px 0 35px 0;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 20px;
        }

        .icon-box svg {
            width: 30px;
            height: 30px;
        }

        h2 {
            font-size: 20px;
            margin-bottom: 15px;
            color: #0a1f44;
        }

        p {
            font-size: 14px;
            color: #6b7280;
            line-height: 1.6;
            margin-bottom: 20px;
        }

        .btn {
            display: inline-block;
            padding: 10px 20px;
            background: #0a1f44;
            color: #ffffff;
            text-decoration: none;
            border-radius: 4px;
            font-size: 14px;
            transition: 0.3s;
        }

        .btn:hover {
            background: #142f6e;
        }
    </style>

</head>

<body>

    <div class="card">
        <div class="icon-box">
            <svg viewBox="0 0 24 24" fill="none">
                <path d="M3 17V7M3 17H21M3 17L8 12L13 16L21 8" stroke="white" stroke-width="2" stroke-linecap="round"
                    stroke-linejoin="round" />
            </svg>
        </div>

        <h2>SEO Optimization</h2>

        <p>
            Clita erat ipsum et lorem et sit, sed stet no labore lorem sit.
            Sanctus clita duo justo et tempor eirmod magna
        </p>

        <a href="#" class="btn">Read More</a>
    </div>

</body>

</html>
