<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title></title>
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-image: url(/images/login.jpg);
            background-size: cover;
            background-repeat: no-repeat;
        }
        
        .logo {
            font-size: 40px;
        }
        
        .container {
            background: rgba(20, 20, 20, .35);
            backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, .15);
            box-shadow: 0 8px 30px rgba(0, 0, 0, .4);
            width: 400px;
            padding: 50px;
            border-radius: 15px;
            text-align: center;
            color: white;
            transition: 0.5s;
        }
        
        .header h2 {
            letter-spacing: 3px;
            font-size: 25px;
            font-weight: 800;
        }
        
        .container:hover {
            transform: translateY(-50px);
        }
        
        .input-box {
            display: flex;
            align-items: center;
            border: 1px solid #ccc;
            padding: 10px;
            background: white;
            box-shadow: 0 8px 30px rgba(0, 0, 0, .4);
            border-radius: 8px;
            gap: 10px;
        }
        
        .input-box input {
            border: none;
            padding: 8px;
            outline: none;
            width: 100%;
        }
        
        .input-box img {
            width: 22px;
            height: 22px;
        }
        
        .remember {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .remember a {
            text-decoration: none;
            color: red;
            margin-right: 20px;
        }
        
        button {
            width: 100%;
            text-align: center;
            padding: 15px;
            text-transform: uppercase;
            font-size: 23px;
            border-radius: 10px;
            border: none;
            background: red;
            color: #fff;
            font-weight: bold;
            letter-spacing: 1px;
            transition: 0.4s;
        }
        
        button:hover {
            transform: translateY(-5px);
        }
        
        .line {
            display: flex;
            align-items: center;
            gap: 15px;
        }
        
        .line:before,
        .line:after {
            content: "";
            height: 1px;
            width: 120px;
            background: #000;
        }
        
        .app {
            display: flex;
            justify-content: center;
            align-items: center;
            margin-top: 20px;
            gap: 40px
        }
        
        .app a {
            width: 50px;
            height: 50px;
            padding: 5px;
            border: 1px solid #555;
            border-radius: 50%;
            display: flex;
            background: white;
            justify-content: center;
            align-items: center;
            text-decoration: none;
            color: white;
            font-size: 22px;
        }
        
        .footer {
            margin-top: 30px;
            font-size: 20px;
        }
        
        .footer a {
            color: red;
            text-decoration: none;
        }
    </style>
</head>

<body>
    <section class="container">
        <form>
            <div class="header">
                <div class="logo">
                    <img src="https://img.icons8.com/color/96/toyota.png" width="80" alt="Toyota Logo" class="me-2"><br>
                    <span style="color:red;"><b>TOY</b></span><span style="color: white;"><b>OTA</b></span>

                </div>
                <h2>Welcome Back</h2>
                <p>Login to Your Account</p>
            </div>
            <div>
                <div class="input-box">

                    <img src="https://img.icons8.com/ios-glyphs/30/person-male.png">

                    <input type="email" placeholder="Email or Username">

                </div>
                <br><br>
                <div class="input-box">

                    <img src="https://img.icons8.com/ios-glyphs/30/lock--v1.png">

                    <input type="password" placeholder="Password">
                    <i class="fa-solid fa-eye" id="eye"></i>

                </div>
                <br><br>
                <div class="remember">
                    <div>
                        <input type="checkbox">&nbsp;Remember Me
                    </div>
                    <a href="#">Forget Password?</a>
                </div>
                <br><br>
                <button>LOGIN</button>
                <br><br>
                <div class="line">
                    <span>or continue with
          </span>
                </div>
                <div class="app">
                    <a href="#">
                        <img width="48" height="48" src="https://img.icons8.com/color/48/google-logo.png" alt="google-logo" /></a>

                    <a href="#">
                        <img width="48" height="48" src="https://img.icons8.com/fluency/48/facebook-new.png" alt="facebook-new" /></a>

                    <a href="#">
                        <img width="50" height="50" src="https://img.icons8.com/ios/50/mac-os--v1.png" alt="mac-os--v1" /></a>
                </div>
                <div class="footer">
                    <p>Don't have an account?<a href="#">&nbsp;sign up</a></p>
                </div>
            </div>
        </form>
    </section>
</body>

</html>
