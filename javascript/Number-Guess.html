<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <h2>Guess Any Number</h2>
    <input type="number" id="guess" placeholder="Enter any Number">
    <br><br>
    <button type="button" id="button">click</button>
    <br><br>
    <h2 id="result"></h2>
    <script>
        let button = document.getElementById("button");
        let secret = Math.floor(Math.random() * 10) + 1;
        button.addEventListener("click", function() {
            let guess = Number(document.getElementById("guess").value);
            if (guess === secret) {
                document.getElementById("result").innerText = "Correct Number"
            } else if (guess > secret) {
                document.getElementById("result").innerText = "Big Number";
            } else if (guess < secret) {
                document.getElementById("result").innerText = "Small Number";
            }

        })
    </script>
</body>

</html>
