<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body {
            background: white;
            color: black;
            font-family: serif;
            transition: 0.4s;
        }
        
        .dark {
            background: #222;
            color: white;
        }
        
        button {
            border-radius: 30px;
            padding: 10px 20px;
            font-size: 18px;
            cursor: pointer;
            border: none;
            transition: 0.3s;
        }
        
        button:hover {
            transform: translateY(-5px);
        }
        
        ol {
            padding: 0;
        }
        
        li {
            list-style: none;
            background: lightgrey;
            padding: 12px;
            margin: 8px 0;
            border-radius: 12px;
            font-weight: bold;
            cursor: pointer;
            transition: .3s;
            width: 200px;
            text-align: center;
        }
        
        li:hover {
            background: #2563eb;
            color: white;
            transform: translateX(8px);
        }
    </style>
</head>

<body>
    <button id="btn">D</button>
    <ol>
        <li>chandan</li>
        <li>Prince</li>
    </ol>
    <script>
        let btn = document.getElementById('btn');
        btn.addEventListener("click", function() {
            document.body.classList.toggle("dark");
        });
    </script>
</body>

</html>
