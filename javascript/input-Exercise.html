<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <script>
        let i = '';
        while (i != 'no') {
            let a = prompt("Your Name");
            let b = prompt("Subject?");
            let c = parseInt(prompt("Number"));
            let d = prompt("Grade");
            document.writeln("Name - " + a + "<br> " + "Subject - " + b + "<br> " + "Number - " + c + "<br> " + "Grade - " + d);
            i = prompt("you want ot continue (yes/no)");
        };
    </script>
</body>

</html>
