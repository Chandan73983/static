<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <script>
        let i = [65, 45, 44, 255, 350, 125];
        let all = i.every(function(chandan) {
            return chandan > 40;
        })
        document.writeln(all);
        let i1 = [65, 45, 44, 255, 350, 125];
        let all1 = i.some(function(chandan) {
            return chandan > 50;
        })
        document.writeln(all1);
    </script>
</body>

</html>
