<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <script>
        let i = 1;
        let x = setInterval(function() {
            document.writeln("Number : " + i + "<br>");

            i++;
            if (i > 30) {
                clearInterval(x);
            }
        }, 1000);

        setTimeout(function() {
            document.writeln("welcome chandan");
        }, 3000);
    </script>
</body>

</html>
