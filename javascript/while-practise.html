<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <h1>chandan</h1>
    <h1>Ravi</h1>
    <h1>Prince</h1>
    <h1>Himanshu</h1>
    <script>

        function chandan() {
            alert("chandan");
        }
        function Ravi() {
            alert("Ravi");
        }
        function Prince() {
            alert("Prince");
        }
        function Himanshu() {
            alert("Himanshu");
        }

        let i = 1;
        let x = prompt("1 se 4 tak name likho")

        while (x!=0) {
                    let x = prompt("1 se 4 tak name likho")

            if (x == 1) {
                chandan();
            }
            else if (x == 2) {
                Ravi();
            }
            else if (x == 3) {
                Prince();
            }
            else if (x == 4) {
                Himanshu();
            }

            i++;
        }
    </script>
</body>
